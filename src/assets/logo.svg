<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Star Force Base 1198">
  <defs>
    <linearGradient id="sfb-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.35" stop-color="#FFD34D"/>
      <stop offset="0.7" stop-color="#FFB300"/>
      <stop offset="1" stop-color="#E08900"/>
    </linearGradient>
    <radialGradient id="sfb-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#FFF3C4"/>
      <stop offset="0.75" stop-color="#FFC837" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g fill="url(#sfb-gold)">
    <!-- Horizontal needles -->
    <polygon points="18,256 236,251 236,261"/>
    <polygon points="494,256 276,251 276,261"/>

    <!-- Upper spike -->
    <polygon points="256,14 262,236 250,236"/>
    <!-- Lower spike -->
    <polygon points="256,498 262,330 250,330"/>

    <!-- Diagonal burst needles -->
    <polygon points="196,196 251,250 246,256" opacity="0.9"/>
    <polygon points="316,196 261,250 266,256" opacity="0.9"/>
    <polygon points="196,316 251,262 246,256" opacity="0.9"/>
    <polygon points="316,316 261,262 266,256" opacity="0.9"/>

    <!-- Hull flare below center (shuttle silhouette) -->
    <path d="M243 300
             C 243 316, 236 330, 226 344
             C 216 358, 212 372, 218 388
             C 224 376, 232 368, 240 364
             L 240 400
             C 240 410, 248 416, 256 416
             C 264 416, 272 410, 272 400
             L 272 364
             C 280 368, 288 376, 294 388
             C 300 372, 296 358, 286 344
             C 276 330, 269 316, 269 300 Z" opacity="0.95"/>
  </g>

  <!-- Core burst -->
  <circle cx="256" cy="256" r="52" fill="url(#sfb-core)"/>
  <circle cx="256" cy="256" r="14" fill="#FFFFFF"/>
</svg>
