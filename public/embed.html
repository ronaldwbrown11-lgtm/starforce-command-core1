<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="dark" />
  <title>Embedded story — Star Force Base 1198</title>
  <style>
    /* Self-contained embed card — no bundle, no fonts download, no framework.
       The Convex URL placeholder __CONVEX_URL__ is replaced at deploy time by
       the GitHub workflow (falls back to the known project URL). */
    :root {
      --bg: #0A0A0C;
      --panel: #111214;
      --border: #1E2430;
      --text: #F5F9FF;
      --muted: #B7C3D0;
      --faint: #7A8794;
      --cyan: #00E5FF;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: Rajdhani, "Segoe UI", system-ui, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 28rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      padding: 20px;
      box-shadow: 0 0 0 1px rgba(0,229,255,0.08), 0 20px 60px rgba(0,0,0,0.5);
    }
    .eyebrow {
      margin: 0 0 12px;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--cyan);
      font-family: Orbitron, "Segoe UI", system-ui, sans-serif;
    }
    h2 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
    }
    .excerpt {
      margin: 10px 0 0;
      font-size: 0.875rem;
      line-height: 1.6;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .byline { margin: 12px 0 0; font-size: 0.75rem; color: var(--faint); }
    .byline strong { color: var(--cyan); font-weight: 600; }
    .cta {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 16px;
      border-radius: 6px;
      background: var(--cyan);
      color: #001018;
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
      text-align: center;
      transition: background 160ms ease;
    }
    .cta:hover, .cta:focus-visible { background: #33ECFF; }
    .cta:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .status {
      margin: 0;
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .retry {
      margin-top: 12px;
      padding: 8px 16px;
      border: 1px solid rgba(0,229,255,0.4);
      border-radius: 6px;
      background: transparent;
      color: var(--cyan);
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    .retry:hover, .retry:focus-visible { background: rgba(0,229,255,0.1); }
    .retry:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="card" id="card" aria-live="polite">
    <p class="eyebrow">Star Force Base 1198</p>
    <p class="status" id="status">Loading transmission…</p>
  </main>

  <script>
  (function () {
    "use strict";
    // Replaced at deploy time by .github/workflows/deploy.yml.
    var CONVEX_URL = "__CONVEX_URL__" === "__CONVEX_URL__"
      ? "https://lovely-koala-228.convex.cloud"
      : "__CONVEX_URL__";
    var SITE = "https://starforcebase1198.com";

    var card = document.getElementById("card");
    var statusEl = document.getElementById("status");

    function slugFromUrl() {
      // /embed/story/<slug> (served by .htaccess rewrite) or ?slug=<slug>.
      var m = window.location.pathname.match(/^\/embed\/story\/([A-Za-z0-9_-]+)\/?$/);
      if (m) return m[1];
      var q = new URLSearchParams(window.location.search).get("slug") || "";
      return /^[A-Za-z0-9_-]+$/.test(q) ? q : "";
    }

    function esc(s) {
      var d = document.createElement("div");
      d.textContent = String(s == null ? "" : s);
      return d.innerHTML;
    }

    function renderStory(story) {
      var byline = "Filed by <strong>" + esc(story.author.displayName) + "</strong>" +
        (story.author.rank ? " · " + esc(story.author.rank) : "");
      card.innerHTML =
        '<p class="eyebrow">Star Force Base 1198</p>' +
        "<h2>" + esc(story.title) + "</h2>" +
        (story.excerpt ? '<p class="excerpt">' + esc(story.excerpt) + "</p>" : "") +
        '<p class="byline">' + byline + "</p>" +
        '<a class="cta" target="_blank" rel="noopener noreferrer" href="' +
          esc(SITE + "/stories/" + story.slug) + '">Read the full transmission</a>';
    }

    function renderError(message, retryable) {
      card.innerHTML =
        '<p class="eyebrow">Star Force Base 1198</p>' +
        '<p class="status">' + esc(message) + "</p>" +
        (retryable ? '<button type="button" class="retry" id="retry">Retry transmission</button>' : "");
      var btn = document.getElementById("retry");
      if (btn) btn.addEventListener("click", load);
    }

    function fetchWithTimeout(url, ms) {
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, ms);
      return fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          path: "content:storyBySlug",
          args: { slug: slug },
          format: "json",
        }),
        signal: controller.signal,
      }).finally(function () { clearTimeout(timer); });
    }

    var slug = slugFromUrl();

    function load(attempt) {
      if (attempt === undefined) attempt = 0;
      if (!slug) {
        renderError("This transmission is unavailable.", false);
        return;
      }
      statusEl.textContent = "Loading transmission…";
      fetchWithTimeout(CONVEX_URL + "/api/query", 8000)
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (data) {
          var story = data && data.status === "success" ? data.value : null;
          if (story) {
            renderStory(story);
          } else if (attempt < 1) {
            // One silent retry — transient blips happen on iframe refreshes.
            setTimeout(function () { load(attempt + 1); }, 1200);
          } else {
            renderError("This transmission is unavailable.", false);
          }
        })
        .catch(function () {
          if (attempt < 1) {
            setTimeout(function () { load(attempt + 1); }, 1200);
          } else {
            renderError("Signal lost — the transmission couldn't be retrieved. Check your connection.", true);
          }
        });
    }

    load();
  })();
  </script>
</body>
</html>
