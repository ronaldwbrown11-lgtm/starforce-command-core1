<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Force — Armored Vehicle Database</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{margin:0;background:#050a14;color:#c0d8e8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}button,input,select,textarea{font:inherit}.panel{background:rgba(10,22,40,.9);border:1px solid rgba(0,229,255,.22);border-radius:6px}.cyan{color:#00e5ff}.amber{color:#ffd54f}.muted{color:#7890a5}.btn{border:1px solid rgba(0,229,255,.4);color:#00e5ff;background:rgba(0,229,255,.05);border-radius:4px;padding:.65rem 1rem;cursor:pointer}.btn:hover{background:rgba(0,229,255,.14)}.field{width:100%;box-sizing:border-box;background:#050a14;color:#c0d8e8;border:1px solid rgba(0,229,255,.25);border-radius:4px;padding:.65rem}.row{cursor:pointer;border-left:3px solid transparent;padding:.8rem;background:rgba(10,22,40,.55)}.row:hover,.row.active{background:rgba(0,229,255,.1);border-left-color:#00e5ff}.hidden{display:none!important}
</style>
</head>
<body>
<div class="min-h-screen">
<header class="border-b border-cyan-900 p-4"><div class="max-w-7xl mx-auto flex flex-wrap justify-between gap-3"><div><h1 class="text-xl md:text-2xl cyan font-bold tracking-widest">⚡ STAR FORCE — ARMORED VEHICLE DATABASE</h1><p class="amber text-xs mt-1">CLASSIFICATION: TIER 3 RESTRICTED ACCESS — BIGRAVITON PLATFORMS</p></div><a class="btn text-xs" href="https://starforcebase1198.com">Return to Star Force Base</a></div></header>
<main class="max-w-7xl mx-auto p-4 md:p-6"><div class="flex flex-wrap items-center justify-between gap-3 mb-5"><div><p class="cyan text-sm tracking-widest">VEHICLE ROSTER</p><p id="count" class="muted text-xs">Loading records…</p></div><button id="submitBtn" class="btn">Submit a vehicle</button></div>
<div class="grid gap-5 lg:grid-cols-[320px_1fr]"><aside class="panel overflow-hidden"><div class="p-3 border-b border-cyan-900"><input id="search" class="field" placeholder="Search vehicles…" aria-label="Search vehicles"></div><div id="list" class="max-h-[70vh] overflow-y-auto"></div></aside><section id="detail" class="panel p-5 min-h-[420px]"><p class="muted">Select a vehicle to open its full record.</p></section></div>
<div id="modal" class="hidden fixed inset-0 bg-black/80 p-4 overflow-y-auto"><div class="panel max-w-3xl mx-auto p-5"><div class="flex justify-between items-center mb-4"><h2 class="cyan text-lg">Submit armored vehicle</h2><button id="closeBtn" class="btn">Close</button></div><form id="form" class="grid gap-3 sm:grid-cols-2"><input name="designation" class="field" placeholder="Vehicle designation *" required><input name="category" class="field" placeholder="Category *" required><input name="weapon_class" class="field" placeholder="Weapon class *" required><input name="builder" class="field" placeholder="Builder *" required><input name="registry_number" class="field" placeholder="Registry number *" required><input name="status" class="field" value="Active" placeholder="Status *" required><input name="fleet" class="field" placeholder="Primary deployment *" required><input name="hover_range" class="field" placeholder="Operational range *" required><input name="effective_range" class="field" placeholder="Effective range *" required><input name="destructive_power" class="field" placeholder="Destructive power *" required><input name="cruising_speed" class="field" placeholder="Cruising speed *" required><input name="top_speed" class="field" placeholder="Top speed *" required><input name="rof" class="field" placeholder="Rate of fire *" required><input name="power" class="field" placeholder="Power system *" required><input name="damage" class="field" placeholder="Weaponry system *" required><textarea name="primary_spec" class="field sm:col-span-2" placeholder="Primary specifications"></textarea><textarea name="defense" class="field sm:col-span-2" placeholder="Defensive systems"></textarea><textarea name="notes" class="field sm:col-span-2" placeholder="Tactical notes"></textarea><button class="btn sm:col-span-2" type="submit">Send for operator approval</button></form><p id="message" class="mt-3 cyan text-sm" role="status"></p></div></div>
</main></div>
<script>
const API='api.php';let records=[],selected=null;
const $=id=>document.getElementById(id);
async function load(){const q=$('search').value.trim();$('list').innerHTML='<p class="muted p-4">Loading…</p>';try{const r=await fetch(API+'?action=list&q='+encodeURIComponent(q));const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Unable to load records');records=d.records||[];$('count').textContent=records.length+' approved vehicles';renderList()}catch(e){$('list').innerHTML='<p class="text-red-300 p-4">'+e.message+'</p>'}}
function renderList(){const groups={};records.forEach(v=>(groups[v.category]??=[]).push(v));$('list').innerHTML='';Object.entries(groups).forEach(([cat,items])=>{const h=document.createElement('p');h.className='amber text-xs p-2 border-b border-amber-900';h.textContent=cat;$('list').append(h);items.forEach(v=>{const b=document.createElement('button');b.className='row w-full text-left';b.innerHTML='<strong class="cyan block">'+esc(v.designation)+'</strong><span class="muted text-xs">'+esc(v.registry_number)+'</span>';b.onclick=()=>show(v);$('list').append(b)})})}
function show(v){selected=v;$('detail').innerHTML='<p class="amber text-xs">'+esc(v.registry_number)+' · FILE SOURCE 7</p><h2 class="cyan text-2xl font-bold mt-2">'+esc(v.designation)+'</h2><p class="muted mt-1">'+esc(v.weapon_class)+' · '+esc(v.status)+'</p><div class="grid gap-3 sm:grid-cols-2 mt-6">'+[['Taxonomy',v.category],['Manufacturer',v.builder],['Deployment',v.fleet],['Hover range',v.hover_range],['Effective range',v.effective_range],['Destructive power',v.destructive_power],['Cruising speed',v.cruising_speed],['Top speed',v.top_speed],['Rate of fire',v.rof],['Power',v.power],['Weaponry',v.damage]].map(x=>'<div><small class="muted">'+x[0].toUpperCase()+'</small><p>'+esc(x[1])+'</p></div>').join('')+'</div><div class="mt-6 border-t border-cyan-900 pt-4"><h3 class="amber">PRIMARY SPECIFICATION</h3><p class="mt-2 whitespace-pre-wrap">'+esc(v.primary_spec||'—')+'</p><h3 class="amber mt-5">DEFENSIVE ARRAYS</h3><p class="mt-2 whitespace-pre-wrap">'+esc(v.defense||'—')+'</p><h3 class="amber mt-5">TACTICAL NOTES</h3><p class="mt-2 whitespace-pre-wrap">'+esc(v.notes||'—')+'</p></div>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('search').oninput=load;$('submitBtn').onclick=()=>$('modal').classList.remove('hidden');$('closeBtn').onclick=()=>$('modal').classList.add('hidden');$('form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));$('message').textContent='Submitting…';try{const r=await fetch(API+'?action=submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'Submission failed');$('message').textContent='Submitted for operator approval. It will appear after approval.';e.target.reset()}catch(x){$('message').textContent=x.message}};load();
</script>
</body></html>
