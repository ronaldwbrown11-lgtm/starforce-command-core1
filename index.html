<body>
  <style>
    /* SPA route transitions: the router re-renders in place, so give each
       client-side navigation visible feedback instead of an apparent no-op
       (a transitionless paint can make a nav click feel "swallowed"). */
    @keyframes uf-route-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .uf-route-fade {
      animation: uf-route-fade-in 300ms ease-out both;
    }
    @media (prefers-reduced-motion: reduce) {
      .uf-route-fade { animation: none !important; }
    }
    /* Instant tactile feedback: the moment a link is pressed it visibly
       responds, so a click can never feel swallowed while the next page
       loads. */
    a:active { opacity: 0.7; }
    /* Route-change progress bar across the top of the viewport. */
    #uf-route-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0;
      opacity: 0;
      z-index: 2147483000;
      pointer-events: none;
      background: linear-gradient(90deg, #00E5FF, #8B5CF6, #FF3DF2);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.7);
      border-radius: 0 2px 2px 0;
    }
  </style>
  <div id="boot-fallback" role="status" aria-live="polite">
    <style>
      #boot-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        box-sizing: border-box;
        background: #050a14;
        color: #d9f7ff;
        font: 16px/1.6 system-ui, sans-serif;
        text-align: center;
      }
      #boot-fallback > div {
        max-width: 34rem;
        padding: 2rem;
        border: 1px solid rgba(0,229,255,.35);
        border-radius: 12px;
        background: rgba(10,22,40,.9);
      }
      #boot-fallback strong {
        display: block;
        margin-bottom: .5rem;
        color: #00e5ff;
        letter-spacing: .16em;
        text-transform: uppercase;
        font-size: .75rem;
      }
      #boot-fallback p { margin: .5rem 0 0; color: #a9bbdd; }
    </style>
    <div>
      <strong>Star Force Base 1198</strong>
      <div>Starting command interface…</div>
      <p>If this message remains, refresh the page or contact the site operator. No database credentials are required in your browser.</p>
    </div>
  </div>
  <script>
    // SPA route transitions: the router re-renders in place, so give each
    // client-side navigation visible feedback instead of an apparent no-op.
    // The #root content fades in briefly; the boot screen keeps its own
    // stronger boot animation and is untouched by this.
    (function () {
      var bootScreen = document.querySelector("#boot-fallback > div");
      if (bootScreen && bootScreen.animate) {
        bootScreen.animate(
          [
            { opacity: 0, transform: "translateY(6px)" },
            { opacity: 1, transform: "translateY(0)" },
          ],
          { duration: 400, easing: "ease-out", fill: "both" }
        );
      }
      var root = document.getElementById("root");
      if (!root) return;
      // React Router performs SPA navigation via the History API, so wrapping
      // pushState/replaceState + popstate catches exactly the route changes —
      // not data loads or toasts — with zero coupling to the app bundle.
      //
      // pushState fires BEFORE React has rendered the new page, so fading
      // there would flash the OLD page back in. Instead we just "arm" the
      // transition, and the fade starts only when React's commit actually
      // mutates the DOM (caught by a MutationObserver), painting the NEW
      // page in.
      var armed = false;
      var disarmTimer = 0;
      var lastFade = 0;
      var bar = document.getElementById("uf-route-progress");
      var barTimer = 0;
      var barStart = function () {
        if (!bar) return;
        window.clearTimeout(barTimer);
        bar.style.transition = "none";
        bar.style.width = "12%";
        bar.style.opacity = "1";
        // Next frame: let the bar creep toward the finish while loading.
        requestAnimationFrame(function () {
          bar.style.transition = "width 9s cubic-bezier(0.1, 0.9, 0.2, 1)";
          bar.style.width = "85%";
        });
      };
      var barDone = function () {
        if (!bar) return;
        bar.style.transition = "width 220ms ease-out, opacity 260ms ease-out 200ms";
        bar.style.width = "100%";
        bar.style.opacity = "0";
        barTimer = window.setTimeout(function () {
          bar.style.transition = "none";
          bar.style.width = "0";
        }, 500);
      };
      var fadeNow = function (scrollToTop) {
        var now = Date.now();
        if (now - lastFade >= 400) {
          // coalesce rapid successive commits
          lastFade = now;
          root.classList.remove("uf-route-fade");
          // Force a reflow so the animation restarts cleanly.
          void root.offsetWidth;
          root.classList.add("uf-route-fade");
        }
        barDone();
        // New page starts at the top, so the navigation is unmistakable —
        // but only for forward navigation (back/forward keeps position).
        if (scrollToTop) window.scrollTo(0, 0);
      };
      var arm = function (scrollToTop) {
        if (armed) return;
        armed = true;
        barStart();
        var mo = new MutationObserver(function () {
          mo.disconnect();
          armed = false;
          window.clearTimeout(disarmTimer);
          fadeNow(scrollToTop);
        });
        mo.observe(root, { childList: true, subtree: true });
        // If React never mutates the DOM (e.g. re-navigating to the same
        // route), disarm so a later unrelated mutation can't fire the fade.
        disarmTimer = window.setTimeout(function () {
          mo.disconnect();
          armed = false;
          barDone();
        }, 1500);
      };
      ["pushState", "replaceState"].forEach(function (type) {
        var original = history[type];
        history[type] = function () {
          var result = original.apply(this, arguments);
          arm(true);
          return result;
        };
      });
      window.addEventListener("popstate", function () {
        arm(false);
      });
    })();
  </script>
  <div id="root"></div>
  <div id="uf-route-progress" aria-hidden="true"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
